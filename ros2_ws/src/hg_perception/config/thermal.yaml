# MLX90640 thermal camera (thermal_node). Read once at start: relaunch after editing.
thermal_node:
  ros__parameters:
    i2c_device: /dev/i2c-1
    address: 51               # 0x33 (decimal here: the ROS YAML parser is not guaranteed to read hex)
    refresh_rate_hz: 8.0      # Subpages per second: 0.5, 1, 2, 4, 8, 16 (32 and 64 need >400 kHz I2C)
    emissivity: 0.95
    # Orientation: like a normal camera, an object on the sensor's left (seen from behind the
    # sensor) must appear on the left of the image, and the top of the scene at the top.
    flip_horizontal: false    # true if left and right are swapped
    flip_vertical: false      # true if the image is upside down
    frame_id: thermal_link
    log_stats: true           # Once per second: min, max, mean, center temperature and rate

# Person and fire detection (thermal_detector). Room temperature = median of all pixels.
thermal_detector:
  ros__parameters:
    person_delta_c: 3.0       # Person-warm pixel: at least this much above room temperature ...
    person_max_c: 40.0        # ... and at most this hot (rejects heaters, lamps, hot appliances)
    person_min_pixels: 3      # Smallest person cluster, in pixels
    person_min_aspect: 1.5    # Height (rows) >= this x width (cols): standing people, not pets/TVs
    person_min_frames: 3      # Frames in a row a cluster must be seen before it counts as a person
    merge_gap_cols: 3         # Merge clusters at most this many empty columns apart (two legs)
    fire_min_c: 100.0         # Fire if any pixel is at least this hot ...
    fire_min_frames: 8        # ... in this many frames in a row (about 1 s at 8 Hz)
