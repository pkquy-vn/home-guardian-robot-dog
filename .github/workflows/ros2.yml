name: ROS 2 build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  colcon-build:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install package dependencies
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths ros2_ws/src --ignore-src -y --rosdistro jazzy
      - name: colcon build
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --event-handlers console_direct+
