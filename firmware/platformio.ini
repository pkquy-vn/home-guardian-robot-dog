; Home Guardian real-time controller firmware (Teensy 4.1).
; Build:  pio run -d firmware
; Upload: pio run -d firmware -t upload   (only with the robot in a safe state)

[env:teensy41]
platform = teensy@6.0.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags = -I../common/include
